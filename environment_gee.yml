# Optional standalone Conda environment specification for Google Earth Engine (GEE) integration.
# Keep this separate from the core 'sih-app' environment to avoid dependency conflicts.
# Usage:
#   conda env create -f environment_gee.yml
#   conda activate gee-env

name: gee-env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - earthengine-api>=0.1.380
  - geemap>=0.30.0
  - rasterio
  - xarray
  - rioxarray
  - shapely
  - pydantic
